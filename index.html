<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Manrope:wght@400;500;600;700&display=swap');

:root {
  --bg-void: #150b2e;
  --bg-void-deep: #0d0620;
  --surface-card: #241546;
  --surface-card-hi: #331d61;
  --accent-pink: #ff2d78;
  --accent-pink-dim: #b81f57;
  --accent-yellow: #ffd23f;
  --text-primary: #f5efff;
  --text-muted: #b9a9de;

  --font-display: 'Baloo 2', system-ui, sans-serif;
  --font-body: 'Manrope', system-ui, sans-serif;

  --radius-lg: 28px;
  --radius-md: 18px;
  --radius-sm: 12px;
}

* {
  box-sizing: border-box;
}

html, body, #root {
  height: 100%;
}

body {
  margin: 0;
  font-family: var(--font-body);
  color: var(--text-primary);
  background: radial-gradient(circle at 50% 0%, #2a1750 0%, var(--bg-void) 45%, var(--bg-void-deep) 100%);
  background-attachment: fixed;
  min-height: 100vh;
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: contain;
}

#root {
  display: flex;
  flex-direction: column;
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  position: relative;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}

h1, h2, h3 {
  font-family: var(--font-display);
  margin: 0;
  line-height: 1.1;
}

p { margin: 0; }

button {
  font-family: var(--font-body);
  cursor: pointer;
}

button:focus-visible, input:focus-visible, [tabindex]:focus-visible {
  outline: 3px solid var(--accent-yellow);
  outline-offset: 2px;
}

.screen {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 28px 24px 32px;
  gap: 20px;
  animation: screen-in 0.35s ease;
}

@keyframes screen-in {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (prefers-reduced-motion: reduce) {
  * {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

.eyebrow {
  font-family: var(--font-body);
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-size: 12px;
  color: var(--accent-yellow);
}

.title {
  font-size: 34px;
  font-weight: 800;
  color: var(--text-primary);
}

.subtitle {
  font-size: 15px;
  color: var(--text-muted);
  font-weight: 500;
}

.card {
  background: linear-gradient(165deg, var(--surface-card-hi), var(--surface-card));
  border-radius: var(--radius-lg);
  padding: 22px;
  border: 1px solid rgba(255, 255, 255, 0.06);
}

.btn {
  border: none;
  border-radius: var(--radius-md);
  padding: 16px 20px;
  font-weight: 700;
  font-size: 16px;
  font-family: var(--font-display);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: transform 0.15s ease, filter 0.15s ease;
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
  min-height: 48px;
}

.btn:active { transform: scale(0.97); }

.btn-primary {
  background: var(--accent-pink);
  color: #fff;
  box-shadow: 0 8px 20px -6px rgba(255, 45, 120, 0.6);
}

.btn-primary:hover { filter: brightness(1.08); }

.btn-secondary {
  background: rgba(255, 255, 255, 0.06);
  color: var(--text-primary);
  border: 1.5px solid rgba(255, 255, 255, 0.14);
}

.btn-yellow {
  background: var(--accent-yellow);
  color: #251246;
  box-shadow: 0 8px 20px -6px rgba(255, 210, 63, 0.5);
}

.btn-block { width: 100%; }

.text-input {
  width: 100%;
  background: rgba(255, 255, 255, 0.06);
  border: 1.5px solid rgba(255, 255, 255, 0.14);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  font-size: 16px;
  font-weight: 600;
  color: var(--text-primary);
  font-family: inherit;
  min-height: 48px;
}

.text-input::placeholder {
  color: var(--text-muted);
  font-weight: 500;
}

.text-input:focus {
  outline: none;
  border-color: var(--accent-pink);
}

.btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  transform: none;
}

.option-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.option-card {
  background: var(--surface-card);
  border: 2px solid rgba(255, 255, 255, 0.08);
  border-radius: var(--radius-md);
  padding: 18px 14px;
  text-align: left;
  color: var(--text-primary);
  display: flex;
  flex-direction: column;
  gap: 4px;
  touch-action: manipulation;
  min-height: 48px;
}

.option-card:disabled {
  opacity: 0.35;
  filter: grayscale(0.4);
  cursor: not-allowed;
  pointer-events: none;
}

.option-card:active { transform: scale(0.97); transition: transform 0.1s ease; }

.option-card.selected {
  border-color: var(--accent-pink);
  background: linear-gradient(165deg, var(--surface-card-hi), var(--surface-card));
  box-shadow: 0 0 0 1px var(--accent-pink);
}

.option-card .icon { font-size: 26px; }
.option-card .label { font-family: var(--font-display); font-weight: 700; font-size: 16px; }
.option-card .desc { font-size: 12.5px; color: var(--text-muted); }

.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.back-btn {
  background: none;
  border: none;
  color: var(--text-muted);
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 14px;
  padding: 10px 0;
  min-height: 44px;
  display: flex;
  align-items: center;
  touch-action: manipulation;
}

.back-btn:active { opacity: 0.6; transition: opacity 0.1s ease; }

input,
textarea {
  font-size: 16px !important; /* evita el zoom automático de iOS al enfocar */
}

.progress-pill {
  font-size: 12px;
  font-weight: 700;
  color: var(--text-muted);
  background: rgba(255, 255, 255, 0.06);
  padding: 6px 12px;

}

/* ---------- Decorative background ---------- */
.bg-blobs {
  position: fixed;
  inset: 0;
  overflow: hidden;
  z-index: 0;
  pointer-events: none;
}

.bg-blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(60px);
  opacity: 0.55;
}

.bg-blob--pink {
  width: 260px;
  height: 260px;
  background: var(--accent-pink);
  top: -80px;
  right: -60px;
  animation: drift-a 14s ease-in-out infinite;
}

.bg-blob--yellow {
  width: 200px;
  height: 200px;
  background: var(--accent-yellow);
  opacity: 0.28;
  bottom: 10%;
  left: -70px;
  animation: drift-b 18s ease-in-out infinite;
}

.bg-blob--violet {
  width: 300px;
  height: 300px;
  background: #7b3fe4;
  opacity: 0.35;
  bottom: -120px;
  right: -80px;
  animation: drift-a 20s ease-in-out infinite reverse;
}

@keyframes drift-a {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(-18px, 24px) scale(1.08); }
}

@keyframes drift-b {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(20px, -16px) scale(1.05); }
}

@media (prefers-reduced-motion: reduce) {
  .bg-blob { animation: none !important; }
}

.screen {
  position: relative;
  z-index: 1;
}

/* ---------- Shine sweep on primary button ---------- */
.btn-primary {
  position: relative;
  overflow: hidden;
}

.btn-primary::after {
  content: '';
  position: absolute;
  top: 0;
  left: -75%;
  width: 50%;
  height: 100%;
  background: linear-gradient(115deg, transparent, rgba(255, 255, 255, 0.35), transparent);
  transform: skewX(-20deg);
  animation: shine-sweep 3.2s ease-in-out infinite;
}

@keyframes shine-sweep {
  0% { left: -75%; }
  35%, 100% { left: 140%; }
}

@media (prefers-reduced-motion: reduce) {
  .btn-primary::after { animation: none; display: none; }
}

/* ---------- Hero dice ---------- */
.hero-badge {
  animation: hero-breathe 3.4s ease-in-out infinite;
}

@keyframes hero-breathe {
  0%, 100% { transform: scale(1) rotate(-3deg); }
  50% { transform: scale(1.06) rotate(3deg); }
}

/* ---------- Confetti ---------- */
.confetti-layer {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 50;
  overflow: hidden;
}

.confetti-piece {
  position: absolute;
  top: -10px;
  border-radius: 2px;
  animation-name: confetti-fall;
  animation-timing-function: cubic-bezier(0.4, 0.1, 0.6, 1);
  animation-fill-mode: forwards;
}

@keyframes confetti-fall {
  0% { transform: translateY(0) rotate(0deg); opacity: 1; }
  100% { transform: translateY(var(--fall-distance, 520px)) rotate(var(--spin, 540deg)); opacity: 0; }
}

/* ---------- Roulette glow ---------- */
.roulette-wrap {
  position: relative;
}

.roulette-glow-ring {
  position: absolute;
  inset: -14px;
  border-radius: 50%;
  background: conic-gradient(from 0deg, var(--accent-pink), var(--accent-yellow), var(--accent-pink));
  filter: blur(18px);
  opacity: 0.55;
  animation: ring-spin 4s linear infinite;
  z-index: -1;
}

@keyframes ring-spin {
  to { transform: rotate(360deg); }
}

@media (prefers-reduced-motion: reduce) {
  .roulette-glow-ring { animation: none; }
}

/* ---------- Intensity bars ---------- */
.intensity-bar {
  display: flex;
  gap: 3px;
  margin-top: 6px;
}

.intensity-bar span {
  flex: 1;
  height: 4px;
  border-radius: 3px;
  background: rgba(255, 255, 255, 0.14);
}

.intensity-bar span.filled {
  background: linear-gradient(90deg, var(--accent-yellow), var(--accent-pink));
}

/* ---------- Card reveal ---------- */
.card-reveal {
  animation: card-reveal 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
}

@keyframes card-reveal {
  from { opacity: 0; transform: scale(0.92) translateY(10px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

/* ---------- Trophy glow ---------- */
.trophy-glow {
  animation: trophy-pulse 2.2s ease-in-out infinite;
  display: inline-block;
}

@keyframes trophy-pulse {
  0%, 100% { transform: scale(1); filter: drop-shadow(0 0 0px var(--accent-yellow)); }
  50% { transform: scale(1.12); filter: drop-shadow(0 0 14px var(--accent-yellow)); }
}

/* ---------- Timer con urgencia ---------- */
.timer-urgent {
  color: var(--accent-pink) !important;
  animation: timer-pulse 0.6s ease-in-out infinite;
}

@keyframes timer-pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}

</style>

function pickCard({ type, level, modality, group, history, customCards = [] }) {
  const base = type === 'truth' ? TRUTHS : DARES
  const custom = customCards.filter((c) => c.type === type && c.level === level)

  // Búsqueda progresiva: exacto → ignora grupo → ignora modalidad → cualquier carta del nivel.
  // Así el juego nunca se queda sin nada que mostrar, aunque falte contenido para una combinación puntual.
  const strategies = [
    (c) => c.level === level && (c.modality === 'ambas' || c.modality === modality) && (c.group === 'ambas' || c.group === group),
    (c) => c.level === level && (c.modality === 'ambas' || c.modality === modality),
    (c) => c.level === level && (c.group === 'ambas' || c.group === group),
    (c) => c.level === level,
  ]

  for (const matches of strategies) {
    const pool = [...base.filter(matches), ...custom.filter(matches)]
    if (pool.length === 0) continue
    const unused = pool.filter((c) => !history.includes(c.text))
    const source = unused.length > 0 ? unused : pool
    return source[Math.floor(Math.random() * source.length)]
  }
  return null
}

const STORAGE_KEY = 'vor_client_id'

function randomId() {
  if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID()
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => {
    const r = (Math.random() * 16) | 0
    const v = c === 'x' ? r : (r & 0x3) | 0x8
    return v.toString(16)
  })
}

// Cada dispositivo/navegador tiene un id propio que persiste entre partidas,
// así si alguien recarga la página durante una partida online puede reconectarse
// a la misma sala sin perder su lugar.
function getClientId() {
  let id = localStorage.getItem(STORAGE_KEY)
  if (!id) {
    id = randomId()
    localStorage.setItem(STORAGE_KEY, id)
  }
  return id
}

let ctx = null
let enabled = true
try {
  const stored = localStorage.getItem('vor_effects_enabled')
  enabled = stored === null ? true : stored === '1'
} catch {
  // localStorage puede no estar disponible (modo privado, etc.); seguimos con sonido activado
}

function isEffectsEnabled() {
  return enabled
}

function setEffectsEnabled(value) {
  enabled = value
  try {
    localStorage.setItem('vor_effects_enabled', value ? '1' : '0')
  } catch {
    // no pasa nada si no se puede persistir
  }
}

function getCtx() {
  if (!enabled) return null
  if (!ctx) {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext
    if (!AudioContextClass) return null
    ctx = new AudioContextClass()
  }
  if (ctx.state === 'suspended') ctx.resume()
  return ctx
}

function tone({ freq, duration = 0.12, type = 'sine', volume = 0.16, delay = 0, freqEnd }) {
  const audioCtx = getCtx()
  if (!audioCtx) return
  const osc = audioCtx.createOscillator()
  const gain = audioCtx.createGain()
  osc.type = type
  const startTime = audioCtx.currentTime + delay
  osc.frequency.setValueAtTime(freq, startTime)
  if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, startTime + duration)
  gain.gain.setValueAtTime(volume, startTime)
  gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration)
  osc.connect(gain)
  gain.connect(audioCtx.destination)
  osc.start(startTime)
  osc.stop(startTime + duration + 0.03)
}

// ==== src/state/gameContext.jsx ====
const GameContext = createContext(null)

const FIXED_ROUNDS = 5

const initialState = {
  screen: 'home', // home | setup | players | custom | roulette | challenge | results
  group: null, // 'pareja' | 'grupo'
  modality: null, // 'presencial' | 'distancia'
  players: [], // { id, name, score }
  customCards: [], // { id, type: 'truth'|'dare', level, text, timerSeconds }
  totalTurns: 0,
  turnIndex: 0,
  turnQueue: [], // ids pendientes en el ciclo actual, para repartir turnos parejo
  currentPlayerId: null,
  choice: null, // 'truth' | 'dare'
  level: null,
  card: null,
  cardHistory: [],
  statsThisGame: { truths: 0, daresCompleted: 0, daresFailed: 0 },
  communityEnabled: false,
  communityCards: [], // cartas aprobadas de la comunidad, cargadas al activar el toggle
}

function shuffledIds(players) {
  const ids = players.map((p) => p.id)
  for (let i = ids.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1))
    ;[ids[i], ids[j]] = [ids[j], ids[i]]
  }
  return ids
}

function reducer(state, action) {
  switch (action.type) {
    case 'GO_SETUP':
      return { ...initialState, screen: 'setup' }
    case 'SET_GROUP':
      return { ...state, group: action.group }
    case 'SET_MODALITY':
      return { ...state, modality: action.modality, screen: 'players' }
    case 'ADD_PLAYER': {
      const name = action.name.trim()
      if (!name) return state
      const id = Date.now() + Math.random()
      return { ...state, players: [...state.players, { id, name, score: 0 }] }
    }
    case 'REMOVE_PLAYER':
      return { ...state, players: state.players.filter((p) => p.id !== action.id) }
    case 'GO_CUSTOM':
      return { ...state, screen: 'custom' }
    case 'BACK_TO_PLAYERS':
      return { ...state, screen: 'players' }
    case 'ADD_CUSTOM_CARD': {
      const text = action.text.trim()
      if (!text) return state
      const card = {
        id: Date.now() + Math.random(),
        type: action.cardType,
        level: action.level,
        text,
        timerSeconds: action.cardType === 'dare' ? action.timerSeconds || 30 : undefined,
      }
      return { ...state, customCards: [...state.customCards, card] }
    }
    case 'REMOVE_CUSTOM_CARD':
      return { ...state, customCards: state.customCards.filter((c) => c.id !== action.id) }
    case 'SET_COMMUNITY_ENABLED':
      return { ...state, communityEnabled: action.enabled, communityCards: action.enabled ? state.communityCards : [] }
    case 'SET_COMMUNITY_CARDS':
      return { ...state, communityCards: action.cards }
    case 'START_GAME':
      return {
        ...state,
        screen: 'roulette',
        totalTurns: Math.min(FIXED_ROUNDS, state.players.length > 0 ? FIXED_ROUNDS : 0),
        turnIndex: 0,
        turnQueue: shuffledIds(state.players),
      }
    case 'SPIN_RESULT': {
      let queue = state.turnQueue.filter((id) => id !== action.playerId)
      if (queue.length === 0) queue = shuffledIds(state.players)
      return {
        ...state,
        currentPlayerId: action.playerId,
        turnQueue: queue,
        screen: 'challenge',
        choice: null,
        level: null,
        card: null,
      }
    }
    case 'CHOOSE_TYPE':
      return { ...state, choice: action.choice }
    case 'SELECT_LEVEL': {
      const card = pickCard({
        type: state.choice,
        level: action.level,
        modality: state.modality,
        group: state.group,
        history: state.cardHistory,
        customCards: [...state.customCards, ...(state.communityEnabled ? state.communityCards : [])],
      })
      return { ...state, level: action.level, card }
    }
    case 'REDRAW_CARD': {
      const card = pickCard({
        type: state.choice,
        level: state.level,
        modality: state.modality,
        group: state.group,
        history: state.cardHistory,
        customCards: [...state.customCards, ...(state.communityEnabled ? state.communityCards : [])],
      })
      return { ...state, card }
    }
    case 'MARK_RESULT': {
      const players = state.players.map((p) =>
        p.id === state.currentPlayerId && action.fulfilled ? { ...p, score: p.score + 1 } : p
      )
      const cardHistory = state.card ? [...state.cardHistory, state.card.text] : state.cardHistory
      if (state.card?.communityId) incrementCardUses(state.card.communityId) // fire-and-forget
      const nextTurnIndex = state.turnIndex + 1
      const done = nextTurnIndex >= state.totalTurns
      const statsThisGame = { ...state.statsThisGame }
      if (state.choice === 'truth') statsThisGame.truths += 1
      else if (state.choice === 'dare') {
        if (action.fulfilled) statsThisGame.daresCompleted += 1
        else statsThisGame.daresFailed += 1
      }
      return {
        ...state,
        players,
        cardHistory,
        turnIndex: nextTurnIndex,
        screen: done ? 'results' : 'roulette',
        statsThisGame,
      }
    }
    case 'PLAY_AGAIN':
      return {
        ...initialState,
        screen: 'setup',
      }
    case 'GO_HOME':
      return { ...initialState }
    default:
      return state
  }
}

function GameProvider({ children }) {
  const [state, dispatch] = useReducer(reducer, initialState)
  return <GameContext.Provider value={{ state, dispatch }}>{children}</GameContext.Provider>
}

function useGame() {
  const ctx = useContext(GameContext)
  if (!ctx) throw new Error('useGame debe usarse dentro de GameProvider')
  return ctx
}

const AuthContext = createContext(null)

const AVATAR_EMOJIS = ['🦊', '🐼', '🦁', '🐸', '🐨', '🐯', '🐵', '🐰', '🐺', '🐱', '🐶', '🦄']
const AVATAR_COLORS = ['#ff2d78', '#ffd23f', '#7b3fe4', '#5a2f9e', '#331d61', '#f5efff']

function AuthProvider({ children }) {
  const [session, setSession] = useState(undefined) // undefined = cargando, null = sin sesión
  const [profile, setProfile] = useState(null)
  const [loadingProfile, setLoadingProfile] = useState(false)

  useEffect(() => {
    supabaseClient.auth.getSession().then(({ data }) => setSession(data.session))
    const { data: sub } = supabaseClient.auth.onAuthStateChange((_event, newSession) => {
      setSession(newSession)
    })
    return () => sub.subscription.unsubscribe()
  }, [])

  useEffect(() => {
    const userId = session?.user?.id
    if (!userId) {
      setProfile(null)
      return
    }
    let cancelled = false
    setLoadingProfile(true)
    async function loadProfile() {
      // La fila de perfil la crea un trigger en el signup; puede tardar un instante en aparecer.
      for (let attempt = 0; attempt < 5; attempt++) {
        const { data } = await supabaseClient.from('profiles').select('*').eq('id', userId).maybeSingle()
        if (cancelled) return
        if (data) {
          setProfile(data)
          setLoadingProfile(false)
          return
        }
        await new Promise((r) => setTimeout(r, 400))
      }
      setLoadingProfile(false)
    }
    loadProfile()
    return () => {
      cancelled = true
    }
  }, [session?.user?.id])

  async function signInWithGoogle() {
    await supabaseClient.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.href } })
  }

  async function signInAsGuest() {
    await supabaseClient.auth.signInAnonymously()
  }

  async function signOut() {
    await supabaseClient.auth.signOut()
    setProfile(null)
  }

  async function updateProfile(patch) {
    if (!session?.user?.id) return
    const { data, error } = await supabaseClient.from('profiles').update(patch).eq('id', session.user.id).select().single()
    if (!error) setProfile(data)
    return { data, error }
  }

  // Se llama al terminar una partida (rápida u online, si el anfitrión tiene sesión)
  // para sumar la actividad al perfil.
  async function recordGameResult({ truths = 0, daresCompleted = 0, daresFailed = 0, points = 0 }) {
    if (!session?.user?.id || !profile) return
    const patch = {
      games_played: profile.games_played + 1,
      truths_answered: profile.truths_answered + truths,
      dares_completed: profile.dares_completed + daresCompleted,
      dares_failed: profile.dares_failed + daresFailed,
      points_total: profile.points_total + points,
    }
    await updateProfile(patch)
  }

  const value = {
    session,
    user: session?.user ?? null,
    isLoadingSession: session === undefined,
    profile,
    loadingProfile,
    signInWithGoogle,
    signInAsGuest,
    signOut,
    updateProfile,
    recordGameResult,
  }

  return <AuthContext.Provider value={value}>{children}</AuthContext.Provider>
}

function useAuth() {
  const ctx = useContext(AuthContext)
  if (!ctx) throw new Error('useAuth debe usarse dentro de AuthProvider')
  return ctx
}

const TYPE_LABEL = { truth: 'Verdad', dare: 'Reto' }

function CommunityScreen({ onBack, onCreate, onModerate }) {
  const { user, profile } = useAuth()
  const [cards, setCards] = useState([])
  const [likedIds, setLikedIds] = useState(new Set())
  const [loading, setLoading] = useState(true)
  const [typeFilter, setTypeFilter] = useState('all') // all | truth | dare

  useEffect(() => {
    let cancelled = false
    async function load() {
      setLoading(true)
      const { data } = await fetchApprovedCards({})
      if (cancelled) return
      setCards(data)
      if (user) setLikedIds(await fetchMyLikedCardIds(user.id))
      setLoading(false)
    }
    load()
    return () => {
      cancelled = true
    }
  }, [user])

  async function handleLike(cardId) {
    if (!user) return
    const wasLiked = likedIds.has(cardId)
    // optimista: refleja el cambio antes de la respuesta del servidor
    setLikedIds((prev) => {
      const next = new Set(prev)
      wasLiked ? next.delete(cardId) : next.add(cardId)
      return next
    })
    setCards((prev) =>
      prev.map((c) => (c.id === cardId ? { ...c, likes_count: c.likes_count + (wasLiked ? -1 : 1) } : c))
    )
    await toggleCardLike(cardId)
  }

  const visible = cards.filter((c) => typeFilter === 'all' || c.type === typeFilter)

  return (
    <div className="screen">
      <div className="top-bar">
        <button className="back-btn" onClick={onBack}>
          ‹ Volver
        </button>
        {profile?.is_admin && (
          <button className="progress-pill" onClick={onModerate}>
            Moderar
          </button>
        )}
      </div>

      <div>
        <p className="eyebrow">Contenido de la comunidad</p>
        <h2 className="title" style={{ fontSize: 26 }}>
          Preguntas y retos de otros jugadores
        </h2>
      </div>

      <div className="option-grid" style={{ gridTemplateColumns: 'repeat(3, 1fr)' }}>
        {[
          { id: 'all', label: 'Todas' },
          { id: 'truth', label: 'Verdad' },
          { id: 'dare', label: 'Reto' },
        ].map((f) => (
          <button
            key={f.id}
            className={`option-card ${typeFilter === f.id ? 'selected' : ''}`}
            style={{ padding: '10px 6px' }}
            onClick={() => setTypeFilter(f.id)}
          >
            <span className="label" style={{ fontSize: 13.5 }}>{f.label}</span>
          </button>
        ))}
      </div>

      <div style={{ display: 'flex', flexDirection: 'column', gap: 8, flex: 1, overflowY: 'auto' }}>
        {loading && <p className="subtitle" style={{ textAlign: 'center' }}>Cargando…</p>}
        {!loading && visible.length === 0 && (
          <p className="subtitle" style={{ textAlign: 'center', marginTop: 12 }}>
            Todavía no hay cartas aprobadas de la comunidad.
          </p>
        )}
        {visible.map((c) => (
          <div key={c.id} className="card" style={{ padding: '12px 16px', display: 'flex', flexDirection: 'column', gap: 6 }}>
            <span style={{ fontSize: 13.5 }}>
              <strong>{TYPE_LABEL[c.type]} · N{c.level}</strong>
              <br />
              {c.text}
            </span>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
              <span className="subtitle" style={{ fontSize: 12 }}>Usada {c.uses_count} veces</span>
              <button
                onClick={() => handleLike(c.id)}
                disabled={!user}
                style={{ background: 'none', border: 'none', display: 'flex', alignItems: 'center', gap: 4, padding: 6 }}
              >
                <span style={{ fontSize: 16 }}>{likedIds.has(c.id) ? '❤️' : '🤍'}</span>
                <span style={{ fontSize: 13, fontWeight: 700 }}>{c.likes_count}</span>
              </button>
            </div>
          </div>
        ))}
      </div>

      <button className="btn btn-primary btn-block" onClick={onCreate}>
        + Enviar una pregunta o reto
      </button>
    </div>
  )
}

// ==== src/state/onlineGameContext.jsx ====
const OnlineGameContext = createContext(null)

const ONLINE_FIXED_ROUNDS = 5

const emptyGameState = {
  screen: 'roulette', // roulette | challenge | results
  totalTurns: ONLINE_FIXED_ROUNDS,
  turnIndex: 0,
  turnQueue: [],
  currentPlayerId: null,
  choice: null,
  level: null,
  card: null,
  fulfilled: null,
  cardHistory: [],
}

function shuffleArray(ids) {
  const arr = [...ids]
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1))
    ;[arr[i], arr[j]] = [arr[j], arr[i]]
  }
  return arr
}

function makeRoomCode() {
  // sin caracteres ambiguos (0/O, 1/I) para que sea fácil de dictar/tipear
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'
  let code = ''
  for (let i = 0; i < 5; i++) code += chars[Math.floor(Math.random() * chars.length)]
  return code
}

function OnlineGameProvider({ children }) {
  const clientId = getClientId()
  const [status, setStatus] = useState('idle') // idle | home | lobby | playing | error
  const [error, setError] = useState(null)
  const [room, setRoom] = useState(null) // fila de la tabla rooms
  const [players, setPlayers] = useState([]) // filas de room_players
  const channelRef = useRef(null)

  const isHost = !!room && room.host_client_id === clientId
  const gameState = room?.state ?? emptyGameState
  const me = players.find((p) => p.client_id === clientId) ?? null
  const isMyTurn = !!room && gameState.currentPlayerId === clientId

  const subscribeToRoom = useCallback((roomId) => {
    if (channelRef.current) {
      supabaseClient.removeChannel(channelRef.current)
      channelRef.current = null
    }
    const channel = supabase
      .channel(`room:${roomId}`)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'rooms', filter: `id=eq.${roomId}` }, (payload) => {
        if (payload.eventType === 'DELETE') {
          setError('El anfitrión cerró la partida.')
          setStatus('home')
          setRoom(null)
          return
        }
        setRoom(payload.new)
      })
      .on(
        'postgres_changes',
        { event: '*', schema: 'public', table: 'room_players', filter: `room_id=eq.${roomId}` },
        () => {
          refreshPlayers(roomId)
        }
      )
      .subscribe()
    channelRef.current = channel
  }, [])

  async function refreshPlayers(roomId) {
    const { data } = await supabaseClient.from('room_players').select('*').eq('room_id', roomId).order('joined_at')
    if (data) setPlayers(data)
  }

  useEffect(() => {
    return () => {
      if (channelRef.current) supabaseClient.removeChannel(channelRef.current)
    }
  }, [])

  async function createRoom({ hostName, group }) {
    setError(null)
    let code = makeRoomCode()
    let insertedRoom = null
    for (let attempt = 0; attempt < 5 && !insertedRoom; attempt++) {
      const { data, error: insertError } = await supabase
        .from('rooms')
        .insert({ code, host_client_id: clientId, group_mode: group, status: 'lobby', state: emptyGameState })
        .select()
        .single()
      if (!insertError) {
        insertedRoom = data
      } else if (insertError.code === '23505') {
        code = makeRoomCode() // colisión de código, reintenta
      } else {
        setError('No se pudo crear la sala. Intentá de nuevo.')
        setStatus('error')
        return
      }
    }
    if (!insertedRoom) {
      setError('No se pudo generar un código de sala único. Intentá de nuevo.')
      setStatus('error')
      return
    }
    const { data: playerRow, error: playerError } = await supabase
      .from('room_players')
      .insert({ room_id: insertedRoom.id, client_id: clientId, name: hostName.trim(), is_host: true })
      .select()
      .single()
    if (playerError) {
      setError('No se pudo unir al anfitrión a la sala.')
      setStatus('error')
      return
    }
    setRoom(insertedRoom)
    setPlayers([playerRow])
    subscribeToRoom(insertedRoom.id)
    setStatus('lobby')
  }

  async function joinRoom({ code, name }) {
    setError(null)
    const normalized = code.trim().toUpperCase()
    const { data: foundRoom, error: findError } = await supabase
      .from('rooms')
      .select('*')
      .eq('code', normalized)
      .maybeSingle()
    if (findError || !foundRoom) {
      setError('No encontramos ninguna sala con ese código.')
      return
    }
    if (foundRoom.status === 'finished') {
      setError('Esa partida ya terminó.')
      return
    }
    // reconexión: si este dispositivo ya estaba en la sala, no crea un jugador duplicado
    const { data: existing } = await supabase
      .from('room_players')
      .select('*')
      .eq('room_id', foundRoom.id)
      .eq('client_id', clientId)
      .maybeSingle()

    if (!existing) {
      const { error: insertError } = await supabase
        .from('room_players')
        .insert({ room_id: foundRoom.id, client_id: clientId, name: name.trim() })
      if (insertError) {
        setError('No se pudo unir a la sala. Intentá de nuevo.')
        return
      }
    }

    await refreshPlayers(foundRoom.id)
    setRoom(foundRoom)
    subscribeToRoom(foundRoom.id)
    setStatus(foundRoom.status === 'lobby' ? 'lobby' : 'playing')
  }

  async function leaveRoom() {
    if (channelRef.current) {
      supabaseClient.removeChannel(channelRef.current)
      channelRef.current = null
    }
    if (room && me) {
      if (isHost) {
        await supabaseClient.from('rooms').delete().eq('id', room.id)
      } else {
        await supabaseClient.from('room_players').delete().eq('id', me.id)
      }
    }
    setRoom(null)
    setPlayers([])
    setStatus('home')
  }

  async function updateState(patch) {
    if (!room) return
    const nextState = { ...gameState, ...patch }
    await supabaseClient.from('rooms').update({ state: nextState }).eq('id', room.id)
  }

  // --- Acciones del host: controla el flujo general de la partida ---
  async function startGame() {
    if (!isHost || !room) return
    const ids = players.map((p) => p.client_id)
    await supabase
      .from('rooms')
      .update({
        status: 'playing',
        state: {
          ...emptyGameState,
          totalTurns: Math.min(ONLINE_FIXED_ROUNDS, ids.length),
          turnQueue: shuffleArray(ids),
        },
      })
      .eq('id', room.id)
    setStatus('playing')
  }

  async function spinResult(playerId) {
    if (!isHost) return
    let queue = gameState.turnQueue.filter((id) => id !== playerId)
    if (queue.length === 0) queue = shuffleArray(players.map((p) => p.client_id))
    await updateState({
      currentPlayerId: playerId,
      turnQueue: queue,
      screen: 'challenge',
      choice: null,
      level: null,
      card: null,
      fulfilled: null,
    })
  }

  // --- Acciones de quien tiene el turno: elige personalmente verdad/reto, nivel y si lo cumplió ---
  async function chooseType(choice) {
    if (!isMyTurn) return
    await updateState({ choice })
  }

  async function selectLevel(level) {
    if (!isMyTurn) return
    const card = pickCard({
      type: gameState.choice,
      level,
      modality: 'distancia',
      group: room.group_mode,
      history: gameState.cardHistory,
      customCards: [],
    })
    await updateState({ level, card })
  }

  async function redrawCard() {
    if (!isMyTurn || !gameState.level) return
    const card = pickCard({
      type: gameState.choice,
      level: gameState.level,
      modality: 'distancia',
      group: room.group_mode,
      history: gameState.cardHistory,
      customCards: [],
    })
    await updateState({ card })
  }

  async function setFulfilled(fulfilled) {
    if (!isMyTurn) return
    await updateState({ fulfilled })
  }

  // --- Acción del host: aplica el puntaje del turno actual y avanza ---
  async function nextTurn() {
    if (!isHost || !room) return
    if (gameState.fulfilled) {
      const current = players.find((p) => p.client_id === gameState.currentPlayerId)
      if (current) {
        await supabaseClient.from('room_players').update({ score: current.score + 1 }).eq('id', current.id)
      }
    }
    const cardHistory = gameState.card ? [...gameState.cardHistory, gameState.card.text] : gameState.cardHistory
    const nextTurnIndex = gameState.turnIndex + 1
    const done = nextTurnIndex >= gameState.totalTurns
    await updateState({
      cardHistory,
      turnIndex: nextTurnIndex,
      screen: done ? 'results' : 'roulette',
      currentPlayerId: null,
      choice: null,
      level: null,
      card: null,
      fulfilled: null,
    })
    if (done) await supabaseClient.from('rooms').update({ status: 'finished' }).eq('id', room.id)
  }

  async function playAgain() {
    if (!isHost || !room) return
    await supabaseClient.from('room_players').update({ score: 0 }).eq('room_id', room.id).neq('score', 0)
    await startGame()
  }

  const value = {
    clientId,
    status,
    setStatus,
    error,
    setError,
    room,
    players,
    isHost,
    me,
    isMyTurn,
    gameState,
    createRoom,
    joinRoom,
    leaveRoom,
    startGame,
    spinResult,
    chooseType,
    selectLevel,
    redrawCard,
    setFulfilled,
    nextTurn,
    playAgain,
  }

  return <OnlineGameContext.Provider value={value}>{children}</OnlineGameContext.Provider>
}

function useOnlineGame() {
  const ctx = useContext(OnlineGameContext)
  if (!ctx) throw new Error('useOnlineGame debe usarse dentro de OnlineGameProvider')
  return ctx
}

const MIN_PLAYERS = { pareja: 2, grupo: 3 }

function PlayersScreen() {
  const { state, dispatch } = useGame()
  const [name, setName] = useState('')
  const [loadingCommunity, setLoadingCommunity] = useState(false)
  const min = MIN_PLAYERS[state.group] ?? 2
  const max = state.group === 'pareja' ? 2 : 12

  function addPlayer() {
    if (state.players.length >= max) return
    dispatch({ type: 'ADD_PLAYER', name })
    setName('')
  }

  async function toggleCommunity() {
    const enabling = !state.communityEnabled
    dispatch({ type: 'SET_COMMUNITY_ENABLED', enabled: enabling })
    if (!enabling) return
    setLoadingCommunity(true)
    const { data } = await fetchApprovedCards({ group: state.group, modality: state.modality })
    const mapped = data.map((c) => ({
      communityId: c.id,
      type: c.type,
      level: c.level,
      modality: c.modality,
      group: c.group_mode,
      text: c.text,
      timerSeconds: c.timer_seconds ?? undefined,
    }))
    dispatch({ type: 'SET_COMMUNITY_CARDS', cards: mapped })
    setLoadingCommunity(false)
  }

  return (
    <div className="screen">
      <div className="top-bar">
        <button className="back-btn" onClick={() => dispatch({ type: 'GO_SETUP' })}>
          ‹ Volver
        </button>
      </div>

      <div>
        <p className="eyebrow">Paso 2 de 2</p>
        <h2 className="title" style={{ fontSize: 26 }}>
          ¿Quiénes juegan?
        </h2>
        <p className="subtitle" style={{ marginTop: 6 }}>
          {state.group === 'pareja' ? 'Necesitas 2 jugadores.' : `Mínimo ${min} jugadores.`}
        </p>
      </div>

      <form
        style={{ display: 'flex', gap: 10 }}
        onSubmit={(e) => {
          e.preventDefault()
          addPlayer()
        }}
      >
        <input
          value={name}
          onChange={(e) => setName(e.target.value)}
          placeholder="Nombre del jugador"
          maxLength={18}
          disabled={state.players.length >= max}
          style={{
            flex: 1,
            background: 'var(--surface-card)',
            border: '1.5px solid rgba(255,255,255,0.1)',
            borderRadius: 14,
            padding: '14px 16px',
            color: 'var(--text-primary)',
            fontSize: 15,
            fontFamily: 'var(--font-body)',
          }}
        />
        <button type="submit" className="btn btn-yellow" disabled={!name.trim() || state.players.length >= max}>
          Agregar
        </button>
      </form>

      <div style={{ display: 'flex', flexDirection: 'column', gap: 8, flex: 1 }}>
        {state.players.map((p, i) => (
          <div
            key={p.id}
            className="card"
            style={{ padding: '12px 16px', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}
          >
            <span style={{ fontFamily: 'var(--font-display)', fontWeight: 700 }}>
              {PLAYER_EMOJIS[i % PLAYER_EMOJIS.length]} {p.name}
            </span>
            <button
              onClick={() => dispatch({ type: 'REMOVE_PLAYER', id: p.id })}
              aria-label={`Quitar a ${p.name}`}
              style={{ background: 'none', border: 'none', color: 'var(--text-muted)', fontSize: 18, padding: 12, minWidth: 44, minHeight: 44 }}
            >
              ✕
            </button>
          </div>
        ))}
        {state.players.length === 0 && (
          <p className="subtitle" style={{ textAlign: 'center', marginTop: 20 }}>
            Todavía no agregaste jugadores.
          </p>
        )}
      </div>

      <button
        className="btn btn-secondary btn-block"
        style={{ fontSize: 14, padding: '12px 16px' }}
        onClick={() => dispatch({ type: 'GO_CUSTOM' })}
      >
        + Agregar preguntas o retos propios{state.customCards.length > 0 ? ` (${state.customCards.length})` : ''}
      </button>

      <button
        className="btn btn-secondary btn-block"
        style={{ fontSize: 14, padding: '12px 16px' }}
        onClick={toggleCommunity}
        disabled={loadingCommunity}
      >
        {loadingCommunity
          ? 'Cargando contenido de la comunidad…'
          : state.communityEnabled
            ? `✓ Contenido de la comunidad activado (${state.communityCards.length})`
            : 'Sumar contenido de la comunidad'}
      </button>

      <button
        className="btn btn-primary btn-block"
        disabled={state.players.length < min}
        onClick={() => dispatch({ type: 'START_GAME' })}
      >
        Empezar a jugar
      </button>
    </div>
  )
}

// ==== src/screens/RouletteScreen.jsx ====
const SEGMENT_COLORS = ['#ff2d78', '#331d61', '#ffd23f', '#5a2f9e']

function polarToCartesian(cx, cy, r, angleDeg) {
  const angleRad = ((angleDeg - 90) * Math.PI) / 180
  return { x: cx + r * Math.cos(angleRad), y: cy + r * Math.sin(angleRad) }
}

function segmentPath(cx, cy, r, startAngle, endAngle) {
  const start = polarToCartesian(cx, cy, r, endAngle)
  const end = polarToCartesian(cx, cy, r, startAngle)
  const largeArc = endAngle - startAngle > 180 ? 1 : 0
  return `M ${cx} ${cy} L ${start.x} ${start.y} A ${r} ${r} 0 ${largeArc} 0 ${end.x} ${end.y} Z`
}

function RouletteScreen() {
  const { state, dispatch } = useGame()
  const players = state.players
  const n = players.length
  const segAngle = 360 / n
  const [rotation, setRotation] = useState(0)
  const [spinning, setSpinning] = useState(false)
  const [justLanded, setJustLanded] = useState(false)
  const chosenRef = useRef(null)

  const segments = useMemo(
    () =>
      players.map((p, i) => ({
        player: p,
        start: i * segAngle,
        end: (i + 1) * segAngle,
        color: SEGMENT_COLORS[i % SEGMENT_COLORS.length],
      })),
    [players, segAngle]
  )

  function spin() {
    if (spinning) return
    setSpinning(true)
    setJustLanded(false)
    // el ganador sale de la cola de turnos pendientes, no de todos los jugadores,
    // así se garantiza que todos jueguen antes de que alguien repita
    const pool = state.turnQueue.length > 0 ? state.turnQueue : players.map((p) => p.id)
    const winnerId = pool[Math.floor(Math.random() * pool.length)]
    const winnerIndex = players.findIndex((p) => p.id === winnerId)
    chosenRef.current = players[winnerIndex].id
    // el puntero está fijo arriba (0deg); centramos el segmento ganador ahí
    const winnerCenter = winnerIndex * segAngle + segAngle / 2
    const extraSpins = 5 * 360
    const target = extraSpins + (360 - winnerCenter)
    setRotation((prev) => prev - (prev % 360) + target)

    // tics que simulan la desaceleración de la ruleta física
    let delay = 40
    let elapsed = 0
    const scheduleTick = () => {
      if (elapsed >= 3100) return
      setTimeout(() => {
        playTick()
        elapsed += delay
        delay = Math.min(delay * 1.18, 220)
        scheduleTick()
      }, delay)
    }
    scheduleTick()
  }

  function handleTransitionEnd() {
    if (!spinning) return
    setSpinning(false)
    setJustLanded(true)
    playLand()
    vibrate([30, 40, 30])
    setTimeout(() => {
      dispatch({ type: 'SPIN_RESULT', playerId: chosenRef.current })
    }, 550)
  }

  const cx = 150
  const cy = 150
  const r = 145

  return (
    <div className="screen" style={{ alignItems: 'center', textAlign: 'center', justifyContent: 'center', gap: 28 }}>
      <div>
        <span className="progress-pill">
          Turno {state.turnIndex + 1} de {state.totalTurns}
        </span>
      </div>

      <h2 className="title" style={{ fontSize: 24 }}>
        {spinning ? 'Girando…' : '¿A quién le toca?'}
      </h2>

      {justLanded && <Confetti count={50} />}

      <div className="roulette-wrap" style={{ position: 'relative', width: 'min(280px, 78vw)', height: 'min(280px, 78vw)' }}>
        <div className="roulette-glow-ring" aria-hidden="true" />
        <div
          aria-hidden="true"
          style={{
            position: 'absolute',
            top: -6,
            left: '50%',
            transform: 'translateX(-50%)',
            width: 0,
            height: 0,
            borderLeft: '12px solid transparent',
            borderRight: '12px solid transparent',
            borderTop: '20px solid var(--accent-yellow)',
            zIndex: 2,
            filter: 'drop-shadow(0 2px 4px rgba(0,0,0,0.4))',
          }}
        />
        <svg
          viewBox="0 0 300 300"
          width="100%"
          height="100%"
          style={{
            display: 'block',
            transform: `rotate(${rotation}deg)`,
            transition: spinning ? 'transform 3.2s cubic-bezier(0.15, 0.6, 0.15, 1)' : 'none',
          }}
          onTransitionEnd={handleTransitionEnd}
        >
          <circle cx={cx} cy={cy} r={r} fill="var(--surface-card)" stroke="rgba(255,255,255,0.1)" strokeWidth="2" />
          {segments.map((seg) => {
            const mid = (seg.start + seg.end) / 2
            const labelPos = polarToCartesian(cx, cy, r * 0.62, mid)
            return (
              <g key={seg.player.id}>
                <path d={segmentPath(cx, cy, r, seg.start, seg.end)} fill={seg.color} stroke="var(--bg-void)" strokeWidth="2" />
                <text
                  x={labelPos.x}
                  y={labelPos.y}
                  fill="#fff"
                  fontSize="13"
                  fontWeight="700"
                  fontFamily="Baloo 2, sans-serif"
                  textAnchor="middle"
                  dominantBaseline="middle"
                  transform={`rotate(${mid}, ${labelPos.x}, ${labelPos.y})`}
                >
                  {seg.player.name.length > 10 ? seg.player.name.slice(0, 9) + '…' : seg.player.name}
                </text>
              </g>
            )
          })}
          <circle cx={cx} cy={cy} r={26} fill="var(--accent-pink)" stroke="var(--bg-void)" strokeWidth="3" />
        </svg>
      </div>

      <button className="btn btn-primary btn-block" onClick={spin} disabled={spinning}>
        {spinning ? 'Girando…' : 'Girar la ruleta'}
      </button>
    </div>
  )
}

function ChallengeScreen() {
  const { state, dispatch } = useGame()
  const player = state.players.find((p) => p.id === state.currentPlayerId)
  const [timeLeft, setTimeLeft] = useState(null)
  const [timerRunning, setTimerRunning] = useState(false)

  useEffect(() => {
    setTimeLeft(null)
    setTimerRunning(false)
    if (state.card) {
      playReveal()
      vibrate(15)
    }
  }, [state.card])

  useEffect(() => {
    if (!timerRunning || timeLeft === null) return
    if (timeLeft <= 0) {
      setTimerRunning(false)
      playBuzzer()
      vibrate([100, 50, 100])
      return
    }
    const urgent = timeLeft <= 5
    playCountdownTick(urgent)
    if (urgent) vibrate(15)
    const id = setTimeout(() => setTimeLeft((t) => t - 1), 1000)
    return () => clearTimeout(id)
  }, [timerRunning, timeLeft])

  if (!player) return null

  return (
    <div className="screen">
      <div className="top-bar">
        <span className="progress-pill">
          Turno {state.turnIndex + 1} de {state.totalTurns}
        </span>
        <span className="progress-pill">
          {player.name} · {player.score} pts

      </div>

      <div style={{ textAlign: 'center' }}>
        <p className="eyebrow">Le toca a</p>

          {player.name}

      {!state.choice && (
        <div className="option-grid" style={{ marginTop: 8 }}>
          <button className="option-card" onClick={() => dispatch({ type: 'CHOOSE_TYPE', choice: 'truth' })}>
            <span className="icon">🗣️</span>
            <span className="label">Verdad</span>
            <span className="desc">Responde sin filtro</span>
          </button>
          <button className="option-card" onClick={() => dispatch({ type: 'CHOOSE_TYPE', choice: 'dare' })}>
            <span className="icon">🔥</span>
            <span className="label">Reto</span>
            <span className="desc">Anímate a cumplirlo</span>
          </button>
        </div>
      )}

      {state.choice && !state.card && (
        <div>
          <p className="subtitle" style={{ marginBottom: 10, textAlign: 'center' }}>
            Elegí el nivel de intensidad
          </p>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
            {LEVELS.map((lvl) => (
              <button
                key={lvl.id}
                className="option-card"
                style={{ flexDirection: 'row', alignItems: 'center', justifyContent: 'space-between' }}
                onClick={() => dispatch({ type: 'SELECT_LEVEL', level: lvl.id })}
              >
                <span style={{ flex: 1 }}>
                  <span className="label">
                    {lvl.id}. {lvl.name}
                  </span>
                  <br />
                  <span className="desc">{lvl.tagline}</span>
                  <span className="intensity-bar" aria-hidden="true">
                    {[1, 2, 3, 4].map((n) => (
                      <span key={n} className={n <= lvl.id ? 'filled' : ''} />
                    ))}
                  </span>
                </span>
                <span aria-hidden="true" style={{ fontSize: 18, marginLeft: 10 }}>
                  {'🌶️'.repeat(lvl.id)}
                </span>
              </button>
            ))}
          </div>
        </div>
      )}

      {state.card && (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 16, flex: 1 }}>
          <div
            key={state.card.text}
            className="card card-reveal"
            style={{ flex: 1, display: 'flex', flexDirection: 'column', justifyContent: 'center', gap: 14, minHeight: 180 }}
          >
            <span className="eyebrow">{state.choice === 'truth' ? 'Verdad' : 'Reto'} · Nivel {state.level}</span>

function ResultsScreen() {
  const { state, dispatch } = useGame()
  const { recordGameResult } = useAuth()
  const recorded = useRef(false)
  const ranked = [...state.players].sort((a, b) => b.score - a.score)
  const winner = ranked[0]
  const isTie = ranked.length > 1 && ranked[0].score === ranked[1].score
  const totalPoints = state.players.reduce((sum, p) => sum + p.score, 0)

  useEffect(() => {
    if (recorded.current) return
    recorded.current = true
    playVictory()
    vibrate([50, 50, 50, 50, 150])
    recordGameResult({
      truths: state.statsThisGame.truths,
      daresCompleted: state.statsThisGame.daresCompleted,
      daresFailed: state.statsThisGame.daresFailed,
      points: totalPoints,
    })
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [])

  return (
    <div className="screen" style={{ alignItems: 'center', textAlign: 'center' }}>

// ==== src/screens/online/OnlineRouletteScreen.jsx ====
function OnlineRouletteScreen() {
  const { players, gameState, isHost, spinResult } = useOnlineGame()
  const n = players.length
  const segAngle = 360 / n
  const [rotation, setRotation] = useState(0)
  const [spinning, setSpinning] = useState(false)
  const [justLanded, setJustLanded] = useState(false)
  const chosenRef = useRef(null)

  const segments = useMemo(
    () =>
      players.map((p, i) => ({
        player: p,
        start: i * segAngle,
        end: (i + 1) * segAngle,
        color: SEGMENT_COLORS[i % SEGMENT_COLORS.length],
      })),
    [players, segAngle]
  )

  function spin() {
    if (spinning || !isHost) return
    setSpinning(true)
    setJustLanded(false)
    const pool = gameState.turnQueue.length > 0 ? gameState.turnQueue : players.map((p) => p.client_id)
    const winnerId = pool[Math.floor(Math.random() * pool.length)]
    const winnerIndex = players.findIndex((p) => p.client_id === winnerId)
    chosenRef.current = players[winnerIndex].client_id
    const winnerCenter = winnerIndex * segAngle + segAngle / 2
    const extraSpins = 5 * 360
    const target = extraSpins + (360 - winnerCenter)
    setRotation((prev) => prev - (prev % 360) + target)

    let delay = 40
    let elapsed = 0
    const scheduleTick = () => {
      if (elapsed >= 3100) return
      setTimeout(() => {
        playTick()
        elapsed += delay
        delay = Math.min(delay * 1.18, 220)
        scheduleTick()
      }, delay)
    }
    scheduleTick()
  }

  function handleTransitionEnd() {
    if (!spinning) return
    setSpinning(false)
    setJustLanded(true)
    playLand()
    vibrate([30, 40, 30])
    setTimeout(() => {
      spinResult(chosenRef.current)
    }, 550)
  }

  const cx = 150
  const cy = 150
  const r = 145

  return (
    <div className="screen" style={{ alignItems: 'center', textAlign: 'center', justifyContent: 'center', gap: 28 }}>
      <div>
        <span className="progress-pill">
          Turno {gameState.turnIndex + 1} de {gameState.totalTurns}
        </span>
      </div>

      <h2 className="title" style={{ fontSize: 24 }}>
        {spinning ? 'Girando…' : '¿A quién le toca?'}
      </h2>

      {justLanded && <Confetti count={50} />}

      <div className="roulette-wrap" style={{ position: 'relative', width: 'min(280px, 78vw)', height: 'min(280px, 78vw)' }}>
        <div className="roulette-glow-ring" aria-hidden="true" />
        <div
          aria-hidden="true"
          style={{
            position: 'absolute',
            top: -6,
            left: '50%',
            transform: 'translateX(-50%)',
            width: 0,
            height: 0,
            borderLeft: '12px solid transparent',
            borderRight: '12px solid transparent',
            borderTop: '20px solid var(--accent-yellow)',
            zIndex: 2,
            filter: 'drop-shadow(0 2px 4px rgba(0,0,0,0.4))',
          }}
        />
        <svg
          viewBox="0 0 300 300"
          width="100%"
          height="100%"
          style={{
            display: 'block',
            transform: `rotate(${rotation}deg)`,
            transition: spinning ? 'transform 3.2s cubic-bezier(0.15, 0.6, 0.15, 1)' : 'none',
          }}
          onTransitionEnd={handleTransitionEnd}
        >
          <circle cx={cx} cy={cy} r={r} fill="var(--surface-card)" stroke="rgba(255,255,255,0.1)" strokeWidth="2" />
          {segments.map((seg) => {
            const mid = (seg.start + seg.end) / 2
            const labelPos = polarToCartesian(cx, cy, r * 0.62, mid)
            return (
              <g key={seg.player.id}>
                <path d={segmentPath(cx, cy, r, seg.start, seg.end)} fill={seg.color} stroke="var(--bg-void)" strokeWidth="2" />
                <text
                  x={labelPos.x}
                  y={labelPos.y}
                  fill="#fff"
                  fontSize="13"
                  fontWeight="700"
                  fontFamily="Baloo 2, sans-serif"
                  textAnchor="middle"
                  dominantBaseline="middle"
                  transform={`rotate(${mid}, ${labelPos.x}, ${labelPos.y})`}
                >
                  {seg.player.name.length > 10 ? seg.player.name.slice(0, 9) + '…' : seg.player.name}
                </text>
              </g>
            )
          })}
          <circle cx={cx} cy={cy} r={26} fill="var(--accent-pink)" stroke="var(--bg-void)" strokeWidth="3" />
        </svg>
      </div>

      {isHost ? (
        <button className="btn btn-primary btn-block" onClick={spin} disabled={spinning}>
          {spinning ? 'Girando…' : 'Girar la ruleta'}
        </button>
      ) : (
        <p className="subtitle">Esperando a que el anfitrión gire la ruleta…</p>
      )}
    </div>
  )
}

function OnlineChallengeScreen() {
  const { players, gameState, isHost, isMyTurn, chooseType, selectLevel, redrawCard, setFulfilled, nextTurn } = useOnlineGame()
  const player = players.find((p) => p.client_id === gameState.currentPlayerId)
  const [timeLeft, setTimeLeft] = useState(null)
  const [timerRunning, setTimerRunning] = useState(false)

  useEffect(() => {
    setTimeLeft(null)
    setTimerRunning(false)
    if (gameState.card) {
      playReveal()
      vibrate(15)
    }
  }, [gameState.card])

  useEffect(() => {
    if (!timerRunning || timeLeft === null) return
    if (timeLeft <= 0) {
      setTimerRunning(false)
      playBuzzer()
      vibrate([100, 50, 100])
      return
    }
    const urgent = timeLeft <= 5
    playCountdownTick(urgent)
    if (urgent) vibrate(15)
    const id = setTimeout(() => setTimeLeft((t) => t - 1), 1000)
    return () => clearTimeout(id)

              display: 'flex',
              alignItems: 'center',
              justifyContent: 'space-between',
              border: i === 0 ? '2px solid var(--accent-yellow)' : undefined,
            }}
          >
            <span style={{ fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: 16 }}>
              {i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i + 1}.`} {p.name}
            </span>
            <span style={{ fontWeight: 700, color: 'var(--accent-yellow)' }}>{p.score} pts</span>
          </div>
        ))}
      </div>

      <div style={{ width: '100%', display: 'flex', flexDirection: 'column', gap: 12, marginTop: 'auto' }}>
        {isHost ? (
          <button className="btn btn-primary btn-block" onClick={playAgain}>
            Jugar de nuevo
          </button>
        ) : (
          <p className="subtitle">Esperando a que el anfitrión inicie otra ronda…</p>
        )}
        <button className="btn btn-secondary btn-block" onClick={leaveRoom}>
          Salir de la sala
        </button>
      </div>
    </div>
  )
}

// ==== src/screens/OnlineGameScreen.jsx ====
function OnlineRouter({ onExit }) {
  const { status, room, gameState } = useOnlineGame()

  if (status === 'home' || status === 'error') return <OnlineHomeScreen onExit={onExit} />
  if (status === 'create') return <CreateRoomScreen />
  if (status === 'join') return <JoinRoomScreen />
  if (status === 'lobby') return <LobbyScreen />

  if (status === 'playing' && room) {
    if (gameState.screen === 'challenge') return <OnlineChallengeScreen />
    if (gameState.screen === 'results') return <OnlineResultsScreen />
    return <OnlineRouletteScreen />
  }

  return <OnlineHomeScreen onExit={onExit} />
}

function OnlineGameScreen({ onExit }) {
  return (
    <OnlineGameProvider>
      <InitialStatus />
      <OnlineRouter onExit={onExit} />
    </OnlineGameProvider>
  )
}

// Arranca el modo online en 'home' apenas se monta el provider.
function InitialStatus() {
  const { status, setStatus } = useOnlineGame()
  useEffect(() => {
    if (status === 'idle') setStatus('home')
  }, [status, setStatus])
  return null
}

// ==== src/App.jsx ====
const SCREENS = {
  home: HomeScreen,
  setup: SetupScreen,
  players: PlayersScreen,
  custom: CustomContentScreen,
  roulette: RouletteScreen,
  challenge: ChallengeScreen,
  results: ResultsScreen,
}

function LocalRouter({ onGoOnline, onGoAccount, onGoCommunity }) {
  const { state } = useGame()
  const Screen = SCREENS[state.screen] ?? HomeScreen
  return <Screen onGoOnline={onGoOnline} onGoAccount={onGoAccount} onGoCommunity={onGoCommunity} />
}

function AccountRouter({ onExit }) {
  const { user, isLoadingSession } = useAuth()
  if (isLoadingSession) return null
  return user ? <ProfileScreen onBack={onExit} /> : <SignInScreen onBack={onExit} />
}

function CommunityRouter({ onExit }) {
  const [view, setView] = useState('browse') // 'browse' | 'create' | 'moderate'
  if (view === 'create') return <CreateCommunityCardScreen onBack={() => setView('browse')} />
  if (view === 'moderate') return <AdminModerationScreen onBack={() => setView('browse')} />
  return <CommunityScreen onBack={onExit} onCreate={() => setView('create')} onModerate={() => setView('moderate')} />
}

// Microinteracción global: cualquier botón de la app da un click sutil + vibración corta.
// Así no hace falta cablear sonido a cada botón individualmente.
function useGlobalTapFeedback() {
  useEffect(() => {
    function handlePointerDown(e) {
      const btn = e.target.closest('button')
      if (!btn || btn.disabled) return
      playClick()
      vibrate(10)
    }
    document.addEventListener('pointerdown', handlePointerDown, true)
    return () => document.removeEventListener('pointerdown', handlePointerDown, true)
  }, [])
}

function AppShell() {
  const [mode, setMode] = useState('local') // 'local' | 'online' | 'account' | 'community'
  useGlobalTapFeedback()

  return (
    <>
      <BackgroundBlobs />
      {mode === 'online' && <OnlineGameScreen onExit={() => setMode('local')} />}
      {mode === 'account' && <AccountRouter onExit={() => setMode('local')} />}
      {mode === 'community' && <CommunityRouter onExit={() => setMode('local')} />}
      {mode === 'local' && (
        <LocalRouter
          onGoOnline={() => setMode('online')}
          onGoAccount={() => setMode('account')}
          onGoCommunity={() => setMode('community')}
        />
      )}
    </>
  )
}

function App() {
  return (
    <AuthProvider>
      <GameProvider>
        <AppShell />
      </GameProvider>
    </AuthProvider>
  )
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
